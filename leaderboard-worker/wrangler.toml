name = "pythas-leaderboard"
main = "src/index.js"
compatibility_date = "2024-11-01"

# ------------------------------------------------------------------
# Secrets are NOT stored here. Set them once per environment with:
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   npx wrangler secret put ROBLOX_SYNC_SECRET
#   npx wrangler secret put TURNSTILE_SECRET_KEY   # captcha for /api/register
#
# For local dev (`npx wrangler dev`), put them in a .dev.vars file
# (see .dev.vars.example). .dev.vars is gitignored.
# ------------------------------------------------------------------

# Non-secret config. ALLOWED_ORIGINS locks down browser CORS to your site(s).
# Comma-separated; if removed, the Worker falls back to "*" (open).
[vars]
ALLOWED_ORIGINS = "https://pythas.gg,https://www.pythas.gg"
